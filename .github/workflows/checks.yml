name: Reproducibility checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python package
        run: python -m pip install -e '.[test]'
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Validate numerical record
        run: python scripts/validate_frozen.py && python scripts/verify_tables.py
      - name: Generate figures
        run: python scripts/rebuild_figures_from_frozen.py
      - name: Confirm figure outputs
        run: python scripts/verify_figures.py
