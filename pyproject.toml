[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gut-resource-dimension"
version = "1.0.0"
description = "Code and numerical record for Gut microbial resource use can be low-dimensional yet functionally complex"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Eric Bonabeau"}]
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4", "requests>=2.32,<3",
  "joblib>=1.4,<2", "networkx>=3.3,<4", "openpyxl>=3.1,<4",
  "PyYAML>=6,<7"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
